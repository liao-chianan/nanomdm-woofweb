{% extends "base.html" %}
{% block content %}

<div class="panel">
  <h2>
    ASM 軟體資訊
    <span style="float:right;">
      <button class="secondary" id="download-vpp-btn" type="button">下載 CSV</button>
      <button id="run-vpp-btn" type="button">立即同步軟體</button>
    </span>
  </h2>
  <p style="color:#6b7280; font-size:13px; margin-bottom:14px;">
    每 5 分鐘自動背景同步一次,以下表格顯示的是最近一次同步的快取結果。
    按「立即同步軟體」可以馬上重新查詢一次(過程較慢,會即時顯示進度)。
  </p>
  <div id="vpp-last-sync" style="font-size:13px; color:#6b7280; margin-bottom:12px;">載入中...</div>

  <table class="data-table" id="vpp-table">
    <thead>
      <tr>
        <th>Adam ID</th>
        <th>Bundle ID</th>
        <th>軟體名稱</th>
        <th>總數量</th>
        <th>剩餘量</th>
      </tr>
    </thead>
    <tbody id="vpp-tbody">
      <tr><td colspan="5">載入中...</td></tr>
    </tbody>
  </table>
</div>

<div class="panel hidden" id="vpp-progress-panel">
  <h2>即時查詢進度</h2>
  <div id="vpp-status" style="margin-bottom:10px; font-size:13px; color:#6b7280;"></div>
  <pre id="vpp-output" style="background:#0d1117; color:#c9d6e8; padding:14px 16px; border-radius:6px; min-height:160px; max-height:420px; overflow-y:auto; font-family:var(--mono); font-size:12.5px; white-space:pre-wrap;"></pre>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/asm.js') }}?v={{ static_version }}"></script>
{% endblock %}
